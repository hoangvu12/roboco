[package]
name = "roboco-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The tailcat invite payload (android-next#02); the engine and the mobile
# core use the same major.
base64 = "0.22"
getrandom = "0.3"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
ts-rs.workspace = true
pulldown-cmark.workspace = true
qrcode.workspace = true

[dev-dependencies]
# Encoder round-trip checks decode a rendered module matrix (ticket 32).
image = { version = "0.25", default-features = false }
rqrr = "0.11"
