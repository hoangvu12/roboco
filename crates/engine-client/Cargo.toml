[package]
name = "roboco-engine-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `EngineRegistry::test_local` for other crates' test suites
# (roboco-ui's `set_test_engine`); the crate's own tests use plain `cfg(test)`.
test-support = []

[dependencies]
roboco-proto.workspace = true
roboco-doc.workspace = true
roboco-rpc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
base64 = "0.22"
reqwest.workspace = true
tempfile.workspace = true
sha2.workspace = true

[dev-dependencies]
# Tests drive real `EngineCore`s over loopback; the library itself must never
# link it (cargo tree -e normal -i roboco-engine reports no match).
roboco-engine.workspace = true
async-trait.workspace = true
