[package]
name = "roboco-engine-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `EngineRegistry::test_local` for other crates' test suites
# (roboco-ui's `set_test_engine`); the crate's own tests use plain `cfg(test)`.
test-support = []

[dependencies]
roboco-proto.workspace = true
roboco-doc.workspace = true
roboco-rpc.workspace = true
# TEMPORARY until seam 3 moves Tailcat pairing out of this crate:
# `registry.rs` still calls `roboco_engine::tailcat` from `pair()`.
roboco-engine.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
base64 = "0.22"
reqwest.workspace = true
tempfile.workspace = true
sha2.workspace = true

[dev-dependencies]
async-trait.workspace = true
