[package]
name = "roboco-mobile-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# UniFFI's binding generator on its own (upstream 684becf0f, ci-speed#07):
# it reads the bindings out of a built `roboco_mobile` library (any
# target's), so making them doesn't compile the whole core for the host
# first (`cargo xtask android-core`).
[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# Must match roboco-mobile's uniffi: the generator reads its metadata.
# `cargo xtask android-core` checks Cargo.lock for drift (uniffi_lock.rs).
uniffi = { version = "0.32", features = ["cli"] }
