[package]
name = "roboco-mobile-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The data plane of the Roboco Android app (spec D1 "Option A"): pairing,
# supervised multi-engine connections (feed / calls / transcript / spare),
# lenient decoding of newer engines' payloads, the phone-clock re-stamper and
# the offline cache. Pure Rust + tokio, UniFFI-free, so `cargo test` runs on
# any host. `roboco-mobile` (the UniFFI library Kotlin links) wraps it in
# `client_ffi`.
#
# `roboco-engine` must never appear here as a normal dependency: tests drive
# real in-process engines (spec "Testing Decisions" — no protocol mocks).

[dependencies]
roboco-proto.workspace = true
roboco-doc.workspace = true
roboco-rpc.workspace = true
roboco-engine-client.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
futures = "0.3"
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
tracing.workspace = true
# The Tailcat transport (android-next#02): libroboco_tailcat is dlopen'ed on
# the first Tailcat dial; sha2 derives the non-secret display handle.
libloading = "0.8"
sha2.workspace = true
# The phone's half of the preview session relay (agent-previews ticket 05):
# the GPUI-free client proxy from ticket 04, embedded in the core. Engine-free
# by design, so the mobile core can link it (see the crate's own manifest).
roboco-preview-relay.workspace = true
anyhow.workspace = true
async-trait.workspace = true

[dev-dependencies]
# tests/tailcat_engine.rs prints the route's decisions.
tracing-subscriber.workspace = true
roboco-engine.workspace = true
roboco-harness.workspace = true
roboco-preview.workspace = true
roboco-proto.workspace = true
async-trait.workspace = true
tempfile.workspace = true
# previews/tests.rs: a real loopback dev server (the engine-side relay
# suite's shape) and the scanner's started_at clock.
libc.workspace = true
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
