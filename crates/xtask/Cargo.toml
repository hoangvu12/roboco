[package]
name = "roboco-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Repo maintenance tasks run through `cargo xtask` (.cargo/config.toml alias).
# Gradle's plain `Exec` task and humans call the same entry point from either
# Windows or Linux (android-app#10), so this crate stays std-only plus
# `anyhow` — no clap, no serde, no path-specific dependencies.
[dependencies]
anyhow.workspace = true
