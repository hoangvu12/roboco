[versions]
# Toolchain re-verified 2026-10-12 (see .scratch/android-app/issues/13).
# AGP 9.4.1 carries built-in Kotlin: do NOT apply org.jetbrains.kotlin.android.
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
# The version androidx.activity:activity-compose resolves transitively;
# explicit so LifecycleStartEffect (#05) and ProcessLifecycleOwner (#35)
# compile without relying on a transitive.
lifecycle = "2.11.0"
coroutines = "1.11.0"
datastore = "1.2.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# The AndroidX Test Orchestrator (android-app#30): per-test isolated
# processes + clearPackageData, so every flow test starts unpaired and
# clean. 1.6.1 is the release paired with runner/core 1.7.0
# (developer.android.com/jetpack/androidx/releases/test, re-verified
# 2026-10-12).
androidxTestOrchestrator = "1.6.1"
# UiDevice (pressHome, openNotification, the permission dialog) for
# android-app#28's instrumented flow test, shared by ui-parity #136's
# macrobenchmark module. 2.4.0: the latest stable on Google Maven as of
# 2026-10-12 (ticket 136's re-verification).
uiAutomator = "2.4.0"
# ui-parity #137's MarkdownImageLabTest: Intents.init/intended pins the
# share chooser without a matching activity. 3.7.0 is the release
# paired with runner/core 1.7.0.
androidxTestEspresso = "3.7.0"
jna = "5.19.1"
junit = "4.13.2"
# Squircle corners (SmoothRoundedShape): newest stable 1.x on maven.google.com
# as of 2026-10-12. Multiplatform umbrella; Gradle resolves the -android variant.
graphicsShapes = "1.1.0"
robolectric = "4.17"
roborazzi = "1.76.0"
# Liquid-glass backdrop blur (ui-parity#07): android-app#14's recipe.
# The blur module only — haze-blur-materials is not the iOS look.
haze = "2.0.1"
# Custom Tabs (ui-parity#89, shared with 126's transcript links):
# the version pr609 used; not a Material artifact.
browser = "1.10.0"
# Pinned-folder drag-to-reorder (ui-parity#47): LazyColumn drag handles
# on Compose runtime/animation/foundation only (no material3). Newest
# stable on Maven Central, re-verified 2026-10-12.
reorderable = "3.1.0"
# JankStats, the lab bench's cross-check (ui-parity #136): 1.0.0 stable
# on Google Maven as of 2026-10-12.
androidxMetrics = "1.0.0"
# Macrobenchmark (ui-parity #136's :benchmark module): 1.5.0 stable on
# Google Maven as of 2026-10-12.
androidxBenchmarkMacro = "1.5.0"
# AboutLibraries Gradle plugin (ui-parity#101): JSON only, no library
# artifacts. The newest stable that supports AGP 9 (plugin README,
# re-verified 2026-10-12).
aboutlibraries = "15.2.0"
# The QR scanner (ui-parity#138): CameraX 1.5.1 (newest stable on
# developer.android.com, re-verified 2026-10-14) + ZXing core, both
# Apache-2.0, no Play services, no per-ABI model (android-app#18's pick).
camerax = "1.5.1"
zxing = "3.5.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# The QR decoder itself (ui-parity#138): core only, never ZXing's
# embedded Android artifact (that one brings its own Activity and UI).
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
# Custom Tabs (ui-parity#89): PR chip "Open Pull Request" and 126's
# transcript links — the same launcher and settings for both.
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-orchestrator = { group = "androidx.test", name = "orchestrator", version.ref = "androidxTestOrchestrator" }
androidx-test-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "androidxTestEspresso" }
# The notification flow test (android-app#28): the system permission dialog,
# pressHome and the notification shade. androidTest-only.
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiAutomator" }
# JankStats, the lab bench's cross-check (ui-parity #136): debug and
# benchmark build types only, never release.
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "androidxMetrics" }
# Macrobenchmark, the device-only ScrollPerformanceTests port
# (ui-parity #136's :benchmark module).
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmarkMacro" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# The device-only macrobenchmark module (ui-parity #136): com.android.test
# ships with AGP itself, so it reuses the pinned AGP version.
android-test = { id = "com.android.test", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
