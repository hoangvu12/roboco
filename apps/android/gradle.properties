# Build-speed defaults (android-app#13). Many parallel workers build this
# project; these are required, not optional. The orchestrator's global
# ~/.gradle/gradle.properties keeps daemon heaps at 4g — do not raise them.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.incremental=true

android.useAndroidX=true
kotlin.code.style=official

# Roborazzi: reference images are recorded into (and verified from)
# roborazzi { outputDir } = app/src/test/screenshots, not the CWD.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
