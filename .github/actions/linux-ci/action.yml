name: Linux Rust CI setup
description: >-
  Rust toolchain, optional apt packages (bounded retries, a cached .deb
  directory), the dev-profile build settings, the main-seeded Rust cache and
  a checksum-pinned cargo-nextest for the Linux test jobs (ci-speed 06,
  carrying upstream 9cb1de50f/5d5d93599 by hand). Run actions/checkout first.

inputs:
  rust-cache:
    description: >-
      rust-cache shared key. Jobs with the same key share one entry, so they
      must build the same dependency graph with the same CARGO_* variables.
    required: true
  save-rust-cache:
    description: >-
      Whether this job writes the key's entry on a push to main. Give it to
      exactly one job per key. Pull requests, nightly and dispatch runs never
      write.
    default: 'false'
  apt-packages:
    description: apt packages to install (space separated). Nothing is installed when empty.
    default: ''

runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    # Hosted-runner apt mirrors occasionally stall for minutes (release.yml
    # once spent 24 min in apt-get). apt-install.sh bounds and retries the
    # download into a .deb directory that main pushes save; everything else
    # only restores it. The key names the package list, so a list change
    # starts a fresh entry instead of re-downloading on top of a stale one.
    - name: apt cache key
      id: apt-key
      if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        list=$(printf '%s\n' $APT_PACKAGES | sort | sha256sum | cut -c1-16)
        echo "key=apt-debs-v1-${ImageOS}-${list}-${{ hashFiles('scripts/ci/apt-install.sh') }}" >> "$GITHUB_OUTPUT"
    - name: Restore apt packages
      id: apt-cache
      if: inputs.apt-packages != ''
      uses: actions/cache/restore@v4
      with:
        path: ~/apt-debs/*.deb
        key: ${{ steps.apt-key.outputs.key }}
    - name: Install system packages
      if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        # shellcheck disable=SC2086 # the package list is word-split on purpose
        bash scripts/ci/apt-install.sh $APT_PACKAGES
    - name: Save apt packages
      if: >-
        inputs.apt-packages != '' && steps.apt-cache.outputs.cache-hit != 'true'
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/apt-debs/*.deb
        key: ${{ steps.apt-key.outputs.key }}

    # Exported for the rest of the job: tests build in the dev profile without
    # debug info (smaller, faster to link). CARGO_* variables are part of the
    # rust-cache key, so every job sharing a key gets the same set from here.
    - name: Build settings
      shell: bash
      run: echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.rust-cache }}
        add-job-id-key: 'false'
        save-if: ${{ inputs.save-rust-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        cache-on-failure: 'true'
        # Cargo rebuilds workspace crates after every checkout (mtime
        # freshness), so caching them only grows the entry.
        cache-workspace-crates: 'false'

    # After the cache restore, so the checksum-verified binary is the one that
    # runs (rust-cache restores ~/.cargo/bin).
    - name: Install cargo-nextest
      shell: bash
      run: bash scripts/ci/install-nextest.sh
