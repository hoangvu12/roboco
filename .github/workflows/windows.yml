name: Windows tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'apps/roboco/**'
      - 'dist/windows/**'
      - 'crates/**'
      # Android-only crates: the desktop does not link them.
      - '!crates/text/**'
      - '!crates/mobile/**'
      - '!crates/mobile-client/**'
      - '!crates/android-assets/**'
      - 'scripts/test-windows-*.ps1'
      - 'scripts/package-windows.ps1'
      - '.github/workflows/windows.yml'
  # Main runs seed the Rust cache every PR restores (PR-scoped entries are
  # unreadable from other branches).
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'apps/roboco/**'
      - 'dist/windows/**'
      - 'crates/**'
      # Android-only crates: the desktop does not link them.
      - '!crates/text/**'
      - '!crates/mobile/**'
      - '!crates/mobile-client/**'
      - '!crates/android-assets/**'
      - 'scripts/test-windows-*.ps1'
      - 'scripts/package-windows.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      native_gui:
        description: 'Run native GUI/pixel probes (requires a usable desktop and Direct3D)'
        type: boolean
        default: false

# Test-build tuning, following the big Rust projects (rust-analyzer, Zed,
# Bevy): no incremental compilation, and neutralize the distribution
# profile's thin LTO for test binaries — LTO buys the shipped binary nothing
# here and costs most of the release-compile time. release.yml still builds
# real LTO binaries for distribution.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  # Test builds never serve the React app: stage the placeholder pages so
  # `--release` engine builds pass on a clean checkout (build.rs forbids its
  # debug-only fallback under release, and web/packages/app/dist is not
  # committed). Real bundle builds happen in web-codegen/release workflows.
  ROBOCO_WEB_DIST: ${{ github.workspace }}/crates/engine/assets/web

permissions:
  contents: read

# Superseded PR runs are cancelled; main runs never are, not even while
# queued (a per-run group), so every merge gets a full run and seeds caches.
concurrency:
  group: windows-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  tests:
    runs-on: windows-2022
    # A warm full run took 82 min after agent previews; a colder cache
    # (the application build alone 9 -> 20 min) cancelled one at 90 with
    # every step so far green.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Locate Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes; PRs restore main's entry.
          shared-key: windows-tests
          add-job-id-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: 'true'
          # Cargo rebuilds workspace crates after every checkout (mtime
          # freshness), so caching them only grows the entry.
          cache-workspace-crates: 'false'
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144
      - name: Build the Tailcat adapter (embedded by every cargo build below)
        # crates/engine/build.rs reruns when ROBOCO_TAILCAT_EMBED changes, so
        # every cargo command in this job sees the same value, exported here
        # before the first one; package-windows.ps1 then embeds this build
        # instead of building its own (which rebuilt the engine and the app
        # in packaging, and again in the next test step without it).
        working-directory: adapters/roboco-tailcat
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'target\tailcat\x86_64'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $adapter = Join-Path $dir 'roboco-tailcat.exe'
          go build -mod=readonly -trimpath -o $adapter ./cmd/roboco-tailcat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ROBOCO_TAILCAT_EMBED=$adapter" >> $env:GITHUB_ENV
      - name: Native harness security and integration tests
        # Runs before the full application build: the hardened process
        # behavior must fail the PR early, not after the expensive build.
        run: cargo nextest run --release --locked -p roboco-harness --features native-fixture --lib --test codex_availability --test windows_native -P ci
      # The driver suites whose fixtures run without a POSIX shell: an in-test
      # HTTP/SSE server (OpenCode), node (the Cursor shim), and the Rust Pi
      # RPC peer (ticket 06; upstream #977's Windows-portable pi suite). The
      # shell- and python-fixture suites are unix-only.
      - name: Portable harness integration tests
        run: cargo nextest run --release --locked -p roboco-harness --features native-fixture --test opencode --test cursor_shim --test pi_rpc -P ci
      # Packaging's `cargo build --release -p roboco` is the application build.
      - name: Verify portable and installer packaging
        # Exercise the release packaging script on every PR. -SkipWebBuild:
        # the workflow's ROBOCO_WEB_DIST already stages placeholder pages,
        # and the real web bundle is built by web-codegen/release workflows.
        run: ./scripts/package-windows.ps1 -SkipWebBuild -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - name: Installer install/uninstall
        run: ./scripts/test-windows-installer.ps1
      - name: GUI subsystem and redirected CLI output
        # The packaged roboco.exe is a GUI-subsystem binary (no console flash
        # at startup), and --help, --version and argument errors still reach
        # redirected stdout/stderr with the right exit codes.
        run: ./scripts/test-windows-startup.ps1
      - name: Shader layout tests
        run: cargo nextest run --release --locked -p gpui_windows --lib layout -P ci
      - name: Application and updater tests
        run: cargo nextest run --release --locked -p roboco -p roboco-update -P ci
      - name: Worktree path compatibility
        # Upstream #530: Windows path spellings for custom worktree locations —
        # the proto device_paths lexical navigation plus the engine's
        # worktree-location tests (path length limits, two-step add, aliases).
        run: |
          cargo nextest run --release --locked -p roboco-proto --lib device_paths -P ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --release --locked -p roboco-engine --test worktree_on_run worktree_location_ -P ci
      - name: Engine, RPC, and harness unit tests
        run: cargo nextest run --release --locked -p roboco-engine -p roboco-rpc -p roboco-harness --lib -P ci
      - name: Preview discovery tests
        # agent-previews ticket 02: the Windows listeners() join
        # (GetExtendedTcpTable + sysinfo). The tests spawn real
        # marked/unmarked loopback listeners through the crate's
        # preview-child-server fixture, so they carry no interpreter
        # dependency on the runner image; Linux/macOS run the same suite in
        # preview-tests.yml as the unchanged regression gate.
        run: cargo nextest run --release --locked -p roboco-preview --lib --test discovery -P ci
      - name: Desktop-linked mobile core crates
        # The two mobile-core crates the desktop links (`cargo tree -p roboco
        # -i`). roboco-text/-mobile/-mobile-client are Android-only: ui-tests
        # mobile-core and android.yml test them, and android.yml's Windows
        # leg covers the xtask host path (.dll naming, .exe bindgen). The
        # engine-client tests are timing-sensitive (reconnect backoff,
        # loopback engines); retries come from the ci nextest profile.
        run: cargo nextest run --release --locked -p roboco-markdown -p roboco-engine-client -P ci
      - name: Harness catalog and login tests
        # codex_login_resolution: Windows login-shell resolution (upstream
        # 68ed902e runs it beside the catalog suite).
        run: cargo nextest run --release --locked -p roboco-engine --test codex_catalog --test codex_login_resolution -P ci
      - name: Engine-local integration tests
        run: cargo nextest run --release --locked -p roboco-engine --test engine_local --test local_first --test local_profiles --test project_actions_rpc -P ci
      - name: UI native font geometry test
        # Upstream 3f19c19e: the real-font assertion measures diff geometry
        # against DirectWrite (non-headless platform). nextest runs it in its
        # own process, isolated from the headless suite; the split keeps the
        # real-font assertion and the complete headless suite separately
        # attributed and both mandatory.
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run --release --locked -p roboco-ui --lib -E 'test(native_diff_font_geometry)' -P ci
      - name: UI headless tests
        # Serial on purpose: the gpui test scheduler is not safe under
        # intra-process parallelism (same constraint as the old
        # --test-threads=1). Retries come from the ci nextest profile.
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run --release --locked -p roboco-ui --lib -E 'not(test(native_diff_font_geometry))' -j 1 -P ci
      - name: CLI startup without HOME
        run: |
          # Exercise real path resolution without touching the runner's account.
          # Port zero cannot connect to another running engine.
          $env:HOME = $null
          $env:ROBOCO_DATA_DIR = $null
          $env:ROBOCO_IPC_PORT = '0'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "roboco smoke O'Brien 日本語"
          $expected = Join-Path $env:LOCALAPPDATA 'Roboco'
          $probe = [Diagnostics.ProcessStartInfo]::new()
          $probe.FileName = (Resolve-Path -LiteralPath './target/release/roboco.exe').Path
          $probe.Arguments = 'status'
          $probe.UseShellExecute = $false
          $probe.CreateNoWindow = $true
          $probe.RedirectStandardOutput = $true
          $probe.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($probe)
          try {
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(10000)) {
              $process.Kill()
              throw 'Isolated status probe timed out'
            }
            if ($process.ExitCode -ne 0) { throw "Status failed: $($stderr.Result)" }
            $output = $stdout.Result -split '\r?\n'
          } finally { $process.Dispose() }
          $output
          if (-not ($output -contains "Data dir: $expected")) {
            throw 'Windows startup did not select LOCALAPPDATA/Roboco'
          }
          if (-not ($output -contains 'Engine: not running')) {
            throw 'An isolated Windows startup must report no running engine'
          }
      - name: Build rendering fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
        run: cargo build --release --locked -p roboco-ui --example windows-render-fixture --features windows-render-fixture
      - name: Upload GUI test binaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-binaries
          path: |
            target/release/roboco.exe
            target/release/examples/windows-render-fixture.exe
          if-no-files-found: error
          retention-days: 1

  native-gui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-gui-binaries
          path: target/release
      - name: App lifecycle tests
        run: ./scripts/test-windows-lifecycle.ps1
      - name: Rendering tests
        run: ./scripts/test-windows-rendering.ps1
      - name: Upload GUI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-probes
          path: |
            target/windows-render-*/capture.png
            target/windows-render-*/measurements.json
            target/windows-render-*/stdout.txt
            target/windows-render-*/stderr.txt
            target/windows-lifecycle-*/result.txt
            target/windows-lifecycle-*/run-*.txt
          if-no-files-found: warn
