name: Android

# The Android client scaffold (android-app#13): Gradle builds the debug APK
# from the Rust mobile core (cargo xtask android-core, ticket 10) and runs
# the JVM unit suite — Robolectric against the host core, plus the plain
# version/asset/network tests. Every job that builds the core also builds
# the Go Tailcat transport (android-next#02), so each sets up Go.
#
# Two tiers (ci-speed 08). The `changes` job decides which a run gets:
# - every run: `android` (ubuntu) — debug APK, JVM and buildSrc tests;
# - PRs, when they touch what the APK or the rig is built from
#   (scripts/ci/android-changes.sh): `android-emulator`, the flow suite;
# - PRs, when they touch the Gradle host build: `android-windows`, the
#   bash-free proof (the Gradle tasks need no bash/WSL on Windows);
# - the full tier (push to main, nightly, dispatch, or a PR labelled
#   `ci:full` — add it, then re-run): all of the above, plus the unsigned
#   x86_64 assembleRelease R8 smoke (android-app#31; the signed release APKs
#   are built by release.yml only);
# - nightly and dispatch only: `android-emulator-tablet`, the tablet split
#   shell and the @Tour recordings (non-blocking until it is green, ticket 23).

on:
  # engine/harness are left out of the PR trigger: they reach Android only
  # through the fixture engine, which main pushes and the nightly run cover.
  pull_request:
    paths:
      - 'apps/android/**'
      - 'crates/android-assets/**'
      - 'crates/mobile/**'
      - 'crates/mobile-bindgen/**'
      - 'crates/mobile-client/**'
      - 'crates/engine-client/**'
      - 'crates/preview-relay/**'
      - 'crates/text/**'
      - 'crates/markdown/**'
      - 'crates/doc/**'
      - 'crates/rpc/**'
      - 'crates/proto/**'
      - 'crates/syntax/**'
      - 'crates/xtask/**'
      - 'adapters/roboco-tailcat/**'
      - 'crates/ui/assets/fonts/**'
      - 'crates/ui/assets/icons/**'
      - 'crates/ui/assets/file-icons/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci/android-changes.sh'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'crates/android-assets/**'
      - 'crates/mobile/**'
      - 'crates/mobile-bindgen/**'
      - 'crates/mobile-client/**'
      - 'crates/engine-client/**'
      - 'crates/preview-relay/**'
      - 'crates/text/**'
      - 'crates/markdown/**'
      - 'crates/doc/**'
      - 'crates/engine/**'
      - 'crates/harness/**'
      - 'crates/rpc/**'
      - 'crates/proto/**'
      - 'crates/syntax/**'
      - 'crates/xtask/**'
      - 'adapters/roboco-tailcat/**'
      - 'crates/ui/assets/fonts/**'
      - 'crates/ui/assets/icons/**'
      - 'crates/ui/assets/file-icons/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci/android-changes.sh'
      - '.github/workflows/android.yml'
  # The full tier plus the tablet suite, once a day on main.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      perf_apk:
        # An installable release-speed APK for hand testing smoothness: the
        # `benchmark` build type (R8, mobile-dist core, profileable, signed
        # with the runner's debug key). Uninstall a debug APK first — the
        # debug keys differ per runner.
        description: 'Also build the benchmark APK (release speed, debug-signed) and upload it as roboco-android-benchmark'
        type: boolean
        default: false
      # ci-speed 16's A/B (temporary): the phone emulator's guest CPUs and
      # system image.
      emulator_cores:
        description: 'android-emulator guest CPUs (A/B)'
        type: choice
        options: ['2', '4']
        default: '2'
      emulator_target:
        description: 'android-emulator system image (A/B)'
        type: choice
        options: [google_apis, google_atd, aosp_atd]
        default: google_apis
      # ci-speed 17's A/B (temporary): JVM test forks in android (ubuntu).
      test_forks:
        description: 'JVM test maxParallelForks in android (ubuntu) (A/B)'
        type: choice
        options: ['1', '2']
        default: '1'

permissions:
  contents: read

# Superseded PR runs are cancelled; main runs never are, not even while
# queued (a per-run group). Only main pushes write the caches: one Rust
# `android` entry per OS, written by android-emulator on Linux and by
# android-windows on Windows, and one Gradle entry, written by the ubuntu
# `android` job; the other jobs restore them.
concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  # The runner images' NDK 30 (ci-speed 17): preinstalled on ubuntu-24.04
  # and windows-2022 since 2026-09-17, so the SDK step below downloads
  # nothing.
  ANDROID_NDK_VERSION: 30.0.16248370
  CARGO_NDK_VERSION: 4.1.2
  # Empty, not merely unset: the xtask refuses non-empty RUSTFLAGS overrides
  # (they would replace the 16 KB PT_LOAD alignment rustflags).
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS:

jobs:
  # Which tiers this run needs (scripts/ci/android-changes.sh): `full`,
  # `android_relevant`, `gradle_host`. Off-PR, or with `ci:full`, all true.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.tiers.outputs.full }}
      android_relevant: ${{ steps.tiers.outputs.android_relevant }}
      gradle_host: ${{ steps.tiers.outputs.gradle_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - id: tiers
        name: Pick the tiers
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: bash scripts/ci/android-changes.sh

  android-benchmark-apk:
    # workflow_dispatch with perf_apk only. Its first runs also prove the R8
    # keep rules for the benchmark variant (review-concerns: unverified).
    if: ${{ inputs.perf_apk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: .
      - name: Add the Android Rust target
        run: rustup target add aarch64-linux-android
        working-directory: .
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-benchmark
          add-job-id-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: 'true'
          cache-workspace-crates: 'false'
      # A prebuilt cargo-ndk (no manifest in install-action, so its
      # cargo-binstall fallback: a release binary or quickinstall), not a
      # source build on every ~/.cargo/bin miss (ci-speed 17).
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # android-next#02: the Go Tailcat transport (libroboco_tailcat.so) is
      # built by the same android-core step, one c-shared library per ABI.
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/roboco-tailcat/go.mod
          cache-dependency-path: adapters/roboco-tailcat/go.sum
      # Preinstalled on the image (ci-speed 17); sdkmanager runs only if an
      # image update dropped either.
      - name: Install Android SDK pieces
        shell: pwsh
        run: |
          $ndk = Join-Path $env:ANDROID_HOME "ndk/$env:ANDROID_NDK_VERSION"
          $platform = Join-Path $env:ANDROID_HOME "platforms/android-37.0"
          if ((Test-Path $ndk) -and (Test-Path $platform)) {
            "NDK $env:ANDROID_NDK_VERSION and android-37.0 are preinstalled"
          } else {
            $sdkmanager = Join-Path $env:ANDROID_HOME "cmdline-tools/latest/bin/sdkmanager"
            & $sdkmanager --install "ndk;$env:ANDROID_NDK_VERSION" "platforms;android-37.0" | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }
          }
        working-directory: .
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Saves and restores the configuration cache (ci-speed 17); fork PRs
          # get no secret and just miss.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true # android (ubuntu) is the one Gradle cache writer
      - name: Build the benchmark APK
        run: ./gradlew --stacktrace -ProbocoAbis=arm64-v8a :app:assembleBenchmark
      - name: Upload the benchmark APK
        uses: actions/upload-artifact@v4
        with:
          name: roboco-android-benchmark
          path: apps/android/app/build/outputs/apk/benchmark/*.apk
          retention-days: 14
          if-no-files-found: error

  # Every run. 90: the full tier's R8 smoke (below) adds a mobile-dist core
  # build plus R8 on top of the debug build and the JVM tests.
  android:
    name: android (ubuntu-24.04)
    needs: changes
    # Not gated on `changes` succeeding: without its outputs this is still
    # the always-on tier (the full-tier steps skip).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: .
      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
        working-directory: .
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          add-job-id-key: 'false'
          # The Linux entry is android-emulator's (see concurrency above).
          save-if: 'false'
          cache-on-failure: 'true'
          cache-workspace-crates: 'false'
      # A prebuilt cargo-ndk (no manifest in install-action, so its
      # cargo-binstall fallback: a release binary or quickinstall), not a
      # source build on every ~/.cargo/bin miss (ci-speed 17).
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}
      # 17 is the build JDK; 21 runs the Robolectric test JVMs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
      # android-next#02: the Go Tailcat transport (libroboco_tailcat.so) is
      # built by the same android-core step, one c-shared library per ABI.
      # Every Linux job shares one setup-go entry (its key has no job id).
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/roboco-tailcat/go.mod
          cache-dependency-path: adapters/roboco-tailcat/go.sum
      # Preinstalled on the image (ci-speed 17); sdkmanager runs only if an
      # image update dropped either.
      - name: Install Android SDK pieces
        run: |
          if [ -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            echo "NDK $ANDROID_NDK_VERSION and android-37.0 are preinstalled"
          else
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" "platforms;android-37.0"
          fi
        working-directory: .
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Saves and restores the configuration cache (ci-speed 17); fork PRs
          # get no secret and just miss.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # The one Gradle cache writer, on main pushes only.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      # Temporary (ci-speed 17): where debugCompileClasspath and
      # debugRuntimeClasspath are resolved during configuration (--info
      # prints the stack trace; --dry-run stops before any task runs).
      - name: "Diagnose configuration-time resolution (temporary)"
        continue-on-error: true
        run: |
          ./gradlew --info --dry-run -ProbocoAbis=arm64-v8a,x86_64 :app:assembleDebug :app:testDebugUnitTest :buildSrc:test > "$RUNNER_TEMP/config-info.txt" 2>&1 || true
          grep -n -A80 "was resolved during configuration time" "$RUNNER_TEMP/config-info.txt" | head -400
      - name: Build the debug APK and run the JVM tests
        run: ./gradlew --stacktrace -ProbocoAbis=arm64-v8a,x86_64 -ProbocoTestForks=${{ inputs.test_forks || 1 }} :app:assembleDebug :app:testDebugUnitTest :buildSrc:test
      - name: "R8 smoke — unsigned release build (full tier)"
        # Proves R8 plus the JNA/UniFFI keep rules build before a tag
        # (release.yml runs the real signed build). PRs skip it unless
        # labelled ci:full. Unsigned on purpose: no signing secrets here, and
        # the unsigned path must produce the same R8 output as the signed one
        # (android-app#31).
        id: r8
        if: needs.changes.outputs.full == 'true'
        run: ./gradlew --stacktrace -ProbocoAbis=x86_64 :app:assembleRelease
      - name: Upload the unsigned release APK (manual emulator smoke)
        if: steps.r8.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: roboco-android-release-unsigned
          path: apps/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload the distribution core sizes
        # The R8 smoke's mobile-dist core (x86_64): the sizes ui-tests'
        # deleted android-core job recorded (ci-speed 06).
        if: steps.r8.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-core-sizes
          path: target/android-core/mobile-dist/sizes.json
          if-no-files-found: warn
          retention-days: 30
      # The asset generator and xtask Rust tests run in ui-tests.yml's
      # core-tests (scripts/ci/test-core.sh) since ci-speed 06.
      - name: Check the native libraries in the debug APKs
        shell: pwsh
        run: ./scripts/apk-report.ps1 -Libraries
      - name: Append build sizes to the job summary
        if: always()
        shell: pwsh
        run: ./scripts/apk-report.ps1 -Sizes
      - name: Upload the debug APK
        # Not gated on the JVM tests: assembleDebug runs first in the same
        # Gradle call, so a test failure still leaves an installable APK.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: roboco-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload unit-test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roboco-android-test-reports-ubuntu-24.04
          path: apps/android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # Windows-host proof: the Gradle tasks are bash-free (pwsh + gradlew.bat
  # keep bash off the build path), and the xtask handles .dll/.exe naming
  # (upstream #609 was mac/Linux-only). Full tier, or a PR touching the
  # Gradle host build (`gradle_host`).
  android-windows:
    name: android (windows-2022)
    needs: changes
    if: needs.changes.outputs.gradle_host == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: .
      - name: Add the Android Rust target
        run: rustup target add aarch64-linux-android
        working-directory: .
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          add-job-id-key: 'false'
          # The Windows entry's one writer.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-on-failure: 'true'
          cache-workspace-crates: 'false'
      # A prebuilt cargo-ndk (no manifest in install-action, so its
      # cargo-binstall fallback: a release binary or quickinstall), not a
      # source build on every ~/.cargo/bin miss (ci-speed 17).
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}
      # 17 is the build JDK; 21 runs the Robolectric test JVMs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
      # The Linux jobs share one setup-go entry; a Windows one would add a
      # second, OS-specific entry, so this leg skips the cache.
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/roboco-tailcat/go.mod
          cache-dependency-path: adapters/roboco-tailcat/go.sum
          cache: false
      # Preinstalled on the image (ci-speed 17); sdkmanager runs only if an
      # image update dropped either.
      - name: Install Android SDK pieces
        run: |
          $ndk = Join-Path $env:ANDROID_HOME "ndk/$env:ANDROID_NDK_VERSION"
          $platform = Join-Path $env:ANDROID_HOME "platforms/android-37.0"
          if ((Test-Path $ndk) -and (Test-Path $platform)) {
            "NDK $env:ANDROID_NDK_VERSION and android-37.0 are preinstalled"
          } else {
            $sdkmanager = Join-Path $env:ANDROID_HOME "cmdline-tools/latest/bin/sdkmanager.bat"
            & $sdkmanager --install "ndk;$env:ANDROID_NDK_VERSION" "platforms;android-37.0" | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }
          }
        working-directory: .
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Saves and restores the configuration cache (ci-speed 17); fork PRs
          # get no secret and just miss.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true # android (ubuntu) is the one Gradle cache writer
      - name: Build the debug APK and run the JVM tests
        run: |
          .\gradlew.bat --stacktrace -ProbocoAbis=arm64-v8a :app:assembleDebug :app:testDebugUnitTest :buildSrc:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the native libraries in the debug APKs
        run: ./scripts/apk-report.ps1 -Libraries
      - name: Append build sizes to the job summary
        if: always()
        run: ./scripts/apk-report.ps1 -Sizes
      - name: Upload unit-test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roboco-android-test-reports-windows-2022
          path: apps/android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # android-app#30: the instrumented flow suite against the fixture
  # engines on an API 36 emulator (KVM). The APKs are built first, then
  # flow-tests.sh owns the rest: three android_fixture processes, adb
  # reverse, the suite with the @Tour annotations excluded, and the
  # artefact harvest. Full tier, or
  # a PR touching what the APK or the rig is built from (`android_relevant`).
  android-emulator:
    needs: changes
    if: needs.changes.outputs.android_relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The x86_64 emulator needs only the x86_64 core; connectedDebugAndroidTest
      # is not a unit-test-only invocation, so without this Gradle builds the
      # default arm64-v8a + x86_64 and cargo-ndk fails on the uninstalled
      # aarch64-linux-android target (E0463).
      ROBOCO_ANDROID_ABIS: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the Android Rust target
        run: rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          add-job-id-key: 'false'
          # The Linux writer: the fixture engine (host, dev), the bindgen and
          # the x86_64 core. The ubuntu android job adds only the arm64 core.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-on-failure: 'true'
          cache-workspace-crates: 'false'
      # A prebuilt cargo-ndk (no manifest in install-action, so its
      # cargo-binstall fallback: a release binary or quickinstall), not a
      # source build on every ~/.cargo/bin miss (ci-speed 17).
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}
      # android-next#02: the Go Tailcat transport (libroboco_tailcat.so) is
      # built by the same android-core step, one c-shared library per ABI.
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/roboco-tailcat/go.mod
          cache-dependency-path: adapters/roboco-tailcat/go.sum
      # Preinstalled on the image (ci-speed 17); sdkmanager runs only if an
      # image update dropped either.
      - name: Install Android SDK pieces
        run: |
          if [ -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            echo "NDK $ANDROID_NDK_VERSION and android-37.0 are preinstalled"
          else
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" "platforms;android-37.0"
          fi
      # 17 builds the APKs (the Gradle daemon runs the app's Kotlin + the
      # x86_64 core), before the emulator boots.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Saves and restores the configuration cache (ci-speed 17); fork PRs
          # get no secret and just miss.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true # android (ubuntu) is the one Gradle cache writer
      - name: Build the fixture engine
        run: cargo build --locked -p roboco-engine --example android_fixture
      # android-next#02: the Tailcat smoke (TailcatPairingFlowTest) — the
      # desktop adapter the fixture publishes through and the local DERP
      # relay; flow-tests.sh starts both when these are exported.
      - name: Build the Tailcat smoke pieces (adapter, local DERP relay)
        working-directory: adapters/roboco-tailcat
        run: |
          out="$RUNNER_TEMP/tailcat"
          mkdir -p "$out"
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$out/roboco-tailcat" ./cmd/roboco-tailcat
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$out/roboco-tailcat-testderp" ./cmd/roboco-tailcat-testderp
          {
            echo "ROBOCO_TAILCAT_ADAPTER=$out/roboco-tailcat"
            echo "ROBOCO_TAILCAT_TESTDERP=$out/roboco-tailcat-testderp"
          } >> "$GITHUB_ENV"
      # ci-speed 16: both APKs are built before the emulator boots, so
      # Gradle, rustc and Go get the whole runner instead of sharing it with
      # an idle guest; inside the emulator step connectedDebugAndroidTest
      # finds every compile and package task up to date and only installs
      # and runs. The instrumentation arguments flow-tests.sh passes reach
      # only the connected test task.
      - name: Build the app and test APKs
        working-directory: apps/android
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      # No AVD snapshot cache: it almost never restored, re-uploaded 2.75 GB
      # (the largest cache entry) after green runs, and a cold boot takes
      # ≈ 53 s. -no-snapshot-save skips the snapshot write on exit.
      - name: Run the flow suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: ${{ inputs.emulator_target || 'google_apis' }}
          arch: x86_64
          profile: pixel_7
          cores: ${{ inputs.emulator_cores || 2 }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash apps/android/scripts/flow-tests.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-flow-artifacts
          path: |
            apps/android/app/build/flow-artifacts
            apps/android/app/build/reports/androidTests
          retention-days: 14
          if-no-files-found: ignore

  # android-app#30: the tablet split shell (smallest width ≥ 600) plus the
  # @Tour motion recordings — nightly and dispatch only (user decision
  # 2026-10-28), non-blocking until it has been green three nights (ticket
  # 23). The Tour tests record `screenrecord` mp4s that the artefact step
  # pulls.
  android-emulator-tablet:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROBOCO_ANDROID_ABIS: x86_64 # the x86_64 emulator's core only (see android-emulator)
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the Android Rust target
        run: rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          add-job-id-key: 'false'
          save-if: 'false' # android-emulator writes the same graph
          cache-workspace-crates: 'false'
      # A prebuilt cargo-ndk (no manifest in install-action, so its
      # cargo-binstall fallback: a release binary or quickinstall), not a
      # source build on every ~/.cargo/bin miss (ci-speed 17).
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}
      # android-next#02: the Go Tailcat transport (libroboco_tailcat.so) is
      # built by the same android-core step, one c-shared library per ABI.
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/roboco-tailcat/go.mod
          cache-dependency-path: adapters/roboco-tailcat/go.sum
      # Preinstalled on the image (ci-speed 17); sdkmanager runs only if an
      # image update dropped either.
      - name: Install Android SDK pieces
        run: |
          if [ -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            echo "NDK $ANDROID_NDK_VERSION and android-37.0 are preinstalled"
          else
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" "platforms;android-37.0"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Saves and restores the configuration cache (ci-speed 17); fork PRs
          # get no secret and just miss.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true # android (ubuntu) is the one Gradle cache writer
      - name: Build the fixture engine
        run: cargo build --locked -p roboco-engine --example android_fixture
      # The Tailcat smoke's rig, as in android-emulator: without it
      # TailcatPairingFlowTest's assumption fails, which this runner setup
      # reports as a failure (ci-speed 23).
      - name: Build the Tailcat smoke pieces (adapter, local DERP relay)
        working-directory: adapters/roboco-tailcat
        run: |
          out="$RUNNER_TEMP/tailcat"
          mkdir -p "$out"
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$out/roboco-tailcat" ./cmd/roboco-tailcat
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$out/roboco-tailcat-testderp" ./cmd/roboco-tailcat-testderp
          {
            echo "ROBOCO_TAILCAT_ADAPTER=$out/roboco-tailcat"
            echo "ROBOCO_TAILCAT_TESTDERP=$out/roboco-tailcat-testderp"
          } >> "$GITHUB_ENV"
      # Before the emulator boots, as in android-emulator (ci-speed 16).
      - name: Build the app and test APKs
        working-directory: apps/android
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run the tablet + tour suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          # Cold boot, no AVD cache (see android-emulator).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          # The tour runs WITH its recordings here.
          script: FLOW_INCLUDE_TOUR=1 bash apps/android/scripts/flow-tests.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tablet-artifacts
          path: |
            apps/android/app/build/flow-artifacts
            apps/android/app/build/reports/androidTests
          retention-days: 14
          if-no-files-found: ignore
