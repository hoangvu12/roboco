name: Theme artifact

# The theme artifact (crates/theme/artifact/artifact.json) is generated from
# the Rust sources of truth (crates/theme's builtin registry + roboco-proto's
# layout/motion constants) by `roboco-theme-export`. Android's palette pin
# tests read the artifact, so the gate fails when a source changes without
# regenerating it.

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/theme/**'
      - 'crates/proto/**'
      - 'crates/ui/src/theme.rs'
      - 'crates/ui/src/motion.rs'
      - 'crates/ui/src/transcript.rs'
      - 'crates/ui/src/composer_dock.rs'
      - '.github/workflows/theme-artifact.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/theme/**'
      - 'crates/proto/**'
      - 'crates/ui/src/theme.rs'
      - 'crates/ui/src/motion.rs'
      - 'crates/ui/src/transcript.rs'
      - 'crates/ui/src/composer_dock.rs'
      - '.github/workflows/theme-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; main runs never are (a per-run group).
concurrency:
  group: theme-artifact-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'

jobs:
  export-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: theme
          add-job-id-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: 'true'
      - name: Artifact freshness gate
        run: cargo run --locked -p roboco-theme --bin roboco-theme-export -- --check
      - name: Round-trip tests (registry ↔ artifact)
        run: cargo test --locked -p roboco-theme

