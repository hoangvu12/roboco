name: release
# SCRATCH (never merge): ci-speed 21 negative guard test, linux arm64 only

# Build release artifacts for Roboco's platforms (Windows + Linux + Android)
# and publish them to a GitHub Release:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package-linux.sh,
#     built in an ubuntu:22.04 container so they load on glibc 2.35 and
#     smoke-installed in a clean one (linux-smoke)
#   - Windows per-user setup exes, portable zips, and updater exes (x86_64 +
#     aarch64) via scripts/package-windows.ps1
#   - Android signed, minified, stripped, ABI-split APKs (arm64-v8a +
#     x86_64) via Gradle `:app:assembleRelease` (android-app#31); the R8
#     mapping ships as a release asset outside the updater manifest
#   - scripts/install-windows.ps1, published as `install.ps1` (the Windows
#     one-liner: irm .../releases/latest/download/install.ps1 | iex)
# The in-app updater reads back from this repo's GitHub Releases; the
# Android APKs are listed in manifest.json (sha256) so sideloaders can verify
# them, while desktop updaters ignore the unknown names.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds + uploads artifacts, no release publish; the
# Android job then builds unsigned APKs when the signing secrets are
# absent).
#
# The web client bundle is built before the engine compiles (the engine's
# build.rs stages web/packages/app/dist into crates/engine/web-staging/ for
# rust-embed to bake into the binary — see crates/engine/build.rs).
#
# Android signing: the ANDROID_KEYSTORE_* secrets (see
# docs/reference/android-development.md → Release signing). A tag push
# without them fails before publishing; workflow_dispatch continues
# unsigned.
#
# No Rust or Go caches: an entry saved by a tag run is readable only by that
# tag, so they restored nothing for later releases and evicted main's caches.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Built inside ubuntu:22.04 on the current runners (ci-speed 21, carrying
  # upstream zeronsh/zeron#197 by hand): a glibc binary needs at least the
  # glibc it was built against, so the build userland is the oldest distro
  # the tarballs load on. 22.04 (glibc 2.35, standard support to 2027) rather
  # than the 22.04 runner images, which GitHub retires on 2027-04-17. The
  # image is multi-arch: the arm runner gets an aarch64 22.04 userland.
  # package-linux.sh fails above GLIBC_2.35; linux-smoke installs the
  # tarball in a clean 22.04.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    # A cold build takes ≈ 16 min; one apt stall alone took 24.
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      GLIBC_MAX: '2.30' # SCRATCH: must fail the floor guard
    steps:
      # Before checkout: without git it falls back to the REST tarball.
      # The runner image's preinstalled tools are not in the container:
      # build-essential (cc, binutils for the floor guard), curl (rustup),
      # libssl-dev (ort-sys's build script downloads ONNX Runtime with
      # openssl), xz-utils (setup-node).
      - name: build tools and gpui system deps
        run: |
          apt-get update -qq -o Acquire::Retries=3
          apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 \
            build-essential ca-certificates curl git xz-utils libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - uses: actions/checkout@v4
      - name: rust toolchain (rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: enable pnpm
        run: corepack enable
      - name: install web workspace
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: build web bundle (engine embeds it at compile time)
        working-directory: web
        run: pnpm --filter "@roboco/app" run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/roboco-tailcat/go.mod
          cache: false
      - name: package (fails above the GLIBC_2.35 floor)
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  # The glibc floor as a tested contract: a clean ubuntu:22.04 with only the
  # runtime libraries the README lists (Install → Linux) installs the
  # tarball through its install.sh and runs `roboco --version` and `status`.
