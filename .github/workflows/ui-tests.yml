name: UI tests

# The Linux Rust suites (ci-speed 06): one nextest build per dependency graph
# on the dev profile — core-tests (harness, engine, sync, update, mcp,
# preview, doc, Android asset/xtask tooling), ui-tests (roboco-ui + the
# roboco CLI tests), mobile-core (the Android core's crates + engine-client)
# — plus the Go Tailcat adapter. A nightly release-backstop runs the core
# and UI suites in the optimized profile, the safety net for the dev-profile
# switch (upstream 5d5d93599).
#
# The four PR-tier jobs run on ubuntu-24.04-arm (ci-speed 14): free for
# public repositories, and the same cold test builds finish 10–28 % sooner
# there than on ubuntu-24.04 (ticket 14's A/B). The backstop stays on x64, so x64 Linux still gets a
# daily signal; android.yml stays x64 (aapt2 and the emulator need it).
#
# Android-only changes (apps/android/**) do not run this workflow; android.yml
# covers them.

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.config/nextest.toml'
      - 'crates/**'
      - 'apps/**'
      - '!apps/android/**'
      - 'adapters/roboco-tailcat/**'
      - '.github/actions/linux-ci/**'
      - 'scripts/ci/**'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.config/nextest.toml'
      - 'crates/**'
      - 'apps/**'
      - '!apps/android/**'
      - 'adapters/roboco-tailcat/**'
      - '.github/actions/linux-ci/**'
      - 'scripts/ci/**'
      - '.github/workflows/ui-tests.yml'
  # The release-profile backstop, once a day on main.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      release_backstop:
        description: 'Also run the release-profile backstop (the nightly job)'
        type: boolean
        default: false

permissions:
  contents: read

# Test builds never serve the React app: stage the placeholder pages so
# `--release` engine builds pass on a clean checkout (build.rs forbids its
# debug-only fallback under release, and web/packages/app/dist is not
# committed). The browser fixture renders its own pages, not the bundle.
env:
  ROBOCO_WEB_DIST: ${{ github.workspace }}/crates/engine/assets/web

# Superseded PR runs are cancelled; main runs never are, not even while
# queued (a per-run group). Only main pushes write the Rust caches (the
# linux-ci action's save-rust-cache) and every key has one writer; PRs
# restore main's entries.
concurrency:
  group: ui-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every Linux Rust test that is not UI or mobile core: one build, one
  # nextest run (scripts/ci/test-core.sh lists the packages and binaries).
  # Replaces engine-local-regressions, preview-tests.yml and android.yml's
  # asset generator/xtask step.
  core-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: linux-core
          save-rust-cache: 'true'
      - name: Harness, engine, sync, update, MCP, preview, doc and Android tooling tests
        run: bash scripts/ci/test-core.sh

  # Mobile Rust core (spec D1, android-app#02): the crates the Android app's
  # Kotlin painter leans on, plus engine-client. Pure Rust, no GPUI system deps.
  mobile-core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: linux-mobile
          save-rust-cache: 'true'
      # android-next#02: the Tailcat end-to-end test (mobile-client
      # tests/tailcat_engine.rs) loads the real host libroboco_tailcat, runs
      # the desktop adapter as the engine's server and a local DERP+STUN.
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/roboco-tailcat/go.mod
          cache-dependency-path: adapters/roboco-tailcat/go.sum
      - name: Build the Tailcat test pieces (host library, adapter, local DERP)
        working-directory: adapters/roboco-tailcat
        run: |
          out="$RUNNER_TEMP/tailcat"
          mkdir -p "$out/lib"
          CGO_ENABLED=1 go build -mod=readonly -trimpath -buildvcs=false -buildmode=c-shared -o "$out/lib/libroboco_tailcat.so" ./capi
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$out/roboco-tailcat" ./cmd/roboco-tailcat
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$out/roboco-tailcat-testderp" ./cmd/roboco-tailcat-testderp
          {
            echo "ROBOCO_TAILCAT_LIB_DIR=$out/lib"
            echo "ROBOCO_TAILCAT_ADAPTER=$out/roboco-tailcat"
            echo "ROBOCO_TAILCAT_TESTDERP=$out/roboco-tailcat-testderp"
          } >> "$GITHUB_ENV"
      - name: Mobile core and engine client tests
        # android-next#02: tailcat's own diagnostics (test-only sink) from the
        # host library and the engine's adapter go to stderr for the
        # Tailcat end-to-end test; nextest shows them only for a failure.
        # engine-client runs real engines over loopback with restart/reconnect
        # waits: its own one-thread test group (.config/nextest.toml).
        env:
          ROBOCO_TAILCAT_TEST_LOG: '1'
        run: >-
          cargo nextest run -P ci --locked --no-fail-fast
          -p roboco-text -p roboco-markdown -p roboco-mobile -p roboco-mobile-client
          -p roboco-engine-client
      - name: Tailcat end-to-end (verbose)
        # Already part of the run above; repeated alone with output so a
        # failure shows the adapter and tunnel logs.
        if: failure()
        env:
          ROBOCO_TAILCAT_TEST_LOG: '1'
        run: cargo nextest run -P ci --locked -p roboco-mobile-client --test tailcat_engine --no-capture
      - name: Mobile grammar subset tests
        # android-app#10: the Android core links the middle grammar set
        # (Kotlin/Swift/C++ kept); the subset build must stay green. Its own
        # invocation on purpose: different roboco-syntax features.
        run: cargo nextest run -P ci --locked -p roboco-syntax --no-default-features --features mobile-languages --lib
      - name: Mobile core benches compile
        # Compile only, never run: keeps the criterion bench from rotting.
        # Full tier only (main, dispatch, a `ci:full` PR).
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
        run: cargo bench --locked -p roboco-text --no-run
      - name: Mobile layout bench (informational)
        # android-app#05: the layout bench numbers land in the logs for
        # drift tracking; never gate the build on them. Full tier only.
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
        continue-on-error: true
        run: cargo test --locked --release -p roboco-mobile -- --ignored bench_layout_passes --nocapture

  tailcat-adapter:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/roboco-tailcat/go.mod
          cache-dependency-path: adapters/roboco-tailcat/go.sum
      - name: Managed Tailcat transport regressions
        working-directory: adapters/roboco-tailcat
        env:
          CGO_ENABLED: '0'
        run: go test -mod=readonly -count=1 ./...
      # android-next#02: the C ABI Android loads (./capi). Built and tested
      # with cgo on the host too, so a broken export fails here and not only
      # in the Android jobs.
      - name: C ABI (cgo) vet, tests and host c-shared build
        working-directory: adapters/roboco-tailcat
        env:
          CGO_ENABLED: '1'
        run: |
          go vet -mod=readonly ./capi
          go test -mod=readonly -count=1 ./capi
          go build -mod=readonly -trimpath -buildvcs=false -buildmode=c-shared -o "$RUNNER_TEMP/libroboco_tailcat.so" ./capi
          ls -l "$RUNNER_TEMP/libroboco_tailcat.so"
          for symbol in abi_version start_client close free; do
            nm -D --defined-only "$RUNNER_TEMP/libroboco_tailcat.so" | grep -qE " T roboco_tailcat_${symbol}\$" || {
              echo "::error::libroboco_tailcat.so does not export roboco_tailcat_${symbol}"; exit 1; }
          done

  # One dev-profile build for the GPUI lib tests and the roboco CLI tests
  # (it was two thin-LTO --release builds). roboco-ui runs in a one-thread
  # test group (.config/nextest.toml) — the old --test-threads=1 — while the
  # CLI tests run beside it.
  ui-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    # Cold (no main-seeded linux-ui entry) the dev build is the long pole;
    # lower once ten warm runs are measured.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: linux-ui
          save-rust-cache: 'true'
          apt-packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libx11-dev libxcb1-dev libx11-xcb-dev
            libfontconfig1-dev libfreetype-dev
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: UI, headless layout and engine pairing CLI regressions
        run: >-
          cargo nextest run -P ci --locked --no-fail-fast
          -p roboco-ui --lib
          -p roboco --test pairing_cli --test tailcat_invite_cli --test room_cli

  # The safety net for the dev-profile switch: the core and UI suites in the
  # optimized profile (thin LTO off, as windows.yml does), once a day on main
  # and on demand, on x64 (the daily x64 Linux signal, ci-speed 14). Never
  # saves a cache, so it cannot evict the main-seeded entries PRs depend on.
  release-backstop:
    if: github.event_name == 'schedule' || inputs.release_backstop
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: linux-release-backstop
          apt-packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libx11-dev libxcb1-dev libx11-xcb-dev
            libfontconfig1-dev libfreetype-dev
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Core tests (release)
        run: bash scripts/ci/test-core.sh --release
      - name: UI and CLI tests (release)
        if: ${{ !cancelled() }}
        run: >-
          cargo nextest run -P ci --locked --no-fail-fast --release
          -p roboco-ui --lib
          -p roboco --test pairing_cli --test tailcat_invite_cli --test room_cli
